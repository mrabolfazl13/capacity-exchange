[package]
name = "capacity-exchange-desktop"
version = "0.1.0"
description = "Capacity Exchange — desktop client for the capacity marketplace"
authors = ["Capacity Exchange"]
edition = "2021"
rust-version = "1.77.2"

# The library target is what `tauri build` and a future mobile host both link against;
# main.rs stays a thin shell so the app can be embedded without duplicating setup.
[lib]
name = "capacity_exchange_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# This build box runs out of RAM during link-time optimisation, and a desktop shell gains
# nothing measurable from it. Keep the release profile honest but cheap.
[profile.release]
codegen-units = 16
lto = false
opt-level = 1
debug = false
strip = true
