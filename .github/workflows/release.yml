name: Release build

# Production artifacts only. Triggered by a version tag (`v*`) — pushing the tag is the human
# decision to release, and nothing here deploys to a server.
# Never uses `|| true` or `continue-on-error`: a failed build fails the run, and a missing
# secret or missing configuration stops with a message that says what is missing.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      reason:
        description: Why a manual release build is being produced
        required: false
        default: manual

permissions:
  contents: write

jobs:
  prepare:
    name: check release inputs
    runs-on: ubuntu-latest
    steps:
      - name: API base URL is configured and safe
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${API_BASE_URL:-}" ]; then
            echo "::error::repository variable API_BASE_URL is not set; a release cannot be built against no API"
            exit 1
          fi
          # The Android release build denies plaintext traffic except for the emulator and
          # loopback hosts (mobile/.../network_security_config.xml), so an http:// URL to any
          # other host would produce an APK that fails on the device rather than in CI.
          host=$(printf '%s' "$API_BASE_URL" | sed -E 's#^https?://([^/:]+).*#\1#')
          case "$API_BASE_URL" in
            https://*) : ;;
            http://*) case "$host" in
                10.0.2.2|localhost|127.0.0.1) echo "cleartext allowed for $host (development target)" ;;
                *) echo "::error::$API_BASE_URL is plaintext to a host Android will refuse"; exit 1 ;;
              esac ;;
            *) echo "::error::API_BASE_URL must be an http(s) URL"; exit 1 ;;
          esac

  web:
    name: desktop web bundle
    needs: prepare
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run test -- --run
      - run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-web-dist
          path: desktop/dist
          if-no-files-found: error

  tauri-windows:
    name: tauri windows installer (nsis)
    needs: prepare
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      # tauri.conf.json runs `npm run build` itself (beforeBuildCommand), so this job does not
      # depend on the web job's artifact — a bundle must be produced from the tree it is built from.
      - run: npm ci --no-audit --no-fund
      - run: npm run tauri build
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
      - name: verify the installer exists and is a real binary
        shell: bash
        run: |
          set -euo pipefail
          find src-tauri/target/release/bundle/nsis -maxdepth 1 -name '*.exe' -size +1M \
            -print -quit | grep -q .
      - uses: actions/upload-artifact@v4
        with:
          name: tauri-windows-installer
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  tauri-linux:
    name: tauri linux (compile check, no bundle target shipped)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: system dependencies (webkit2gtk, gtk, patchelf)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: install desktop dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      # The product ships Windows installers (docs/RELEASE.md); there is no Linux bundle target
      # configured, so this job proves the Tauri layer still compiles on Linux instead of
      # pretending to produce an artifact nobody releases.
      - name: cargo release build
        working-directory: desktop
        run: npm run tauri build -- --no-bundle
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
      - name: verify the binary
        working-directory: desktop
        run: |
          set -euo pipefail
          test -s src-tauri/target/release/capacity-exchange-desktop
          file src-tauri/target/release/capacity-exchange-desktop

  android-release:
    name: android release (apk + aab)
    needs: prepare
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: signing material from secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] || missing+=("ANDROID_KEYSTORE_BASE64")
          [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ] || missing+=("ANDROID_KEYSTORE_PASSWORD")
          [ -n "${ANDROID_KEY_ALIAS:-}" ] || missing+=("ANDROID_KEY_ALIAS")
          [ -n "${ANDROID_KEY_PASSWORD:-}" ] || missing+=("ANDROID_KEY_PASSWORD")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::release signing is not configured; missing: ${missing[*]}"
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/release.keystore
          test -s android/release.keystore
          # android/app/build.gradle.kts reads android/key.properties (gitignored); the CI file
          # has the same shape as the one a developer writes locally, so no code path differs.
          cat > android/key.properties <<EOF
          storeFile=$(pwd)/release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # The base URL is a compile-time dart-define (mobile/lib/core/env.dart); passing it as an
      # environment variable would silently ship the emulator default of http://10.0.2.2:8000.
      - name: build apk
        run: flutter build apk --release --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}
      - name: build appbundle
        run: flutter build appbundle --release --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}
      - name: verify the artifacts are signed release outputs
        run: |
          set -euo pipefail
          test -s build/app/outputs/flutter-apk/app-release.apk
          test -s build/app/outputs/bundle/release/app-release.aab
          ls -lh build/app/outputs/flutter-apk/app-release.apk \
                 build/app/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  release:
    name: attach artifacts to the tag
    needs: [web, tauri-windows, tauri-linux, android-release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: collect installers
        run: |
          set -euo pipefail
          mkdir -p out
          find artifacts -type f \( -name '*.exe' -o -name '*.apk' -o -name '*.aab' \) \
            -exec cp -t out {} +
          test -n "$(ls out)"
      # The tag push is the decision to publish; the release is created for that tag only and
      # nothing is deployed to a server from here.
      - name: create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --title "Capacity Exchange $TAG" \
            --notes "Release artifacts built from ${{ github.sha }} by ${{ github.workflow }} run ${{ github.run_id }}. Windows installer, Android APK and Play app bundle are attached." \
            out/*
