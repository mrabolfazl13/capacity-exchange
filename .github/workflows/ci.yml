name: CI

# Honesty rules for this pipeline, agreed in docs/CONTRACTS.md §13 and docs/TESTING_STRATEGY.md:
# no `|| true`, no `continue-on-error`, no skipped assertion. A step that cannot prove what it
# claims exits non-zero. Only official actions and official package repositories are used.

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  API_BASE: http://127.0.0.1:8000/api/v1

jobs:
  ai:
    name: ai (pytest, no database)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e .[test]
      - name: algorithms
        run: python -m pytest -q

  backend:
    name: backend (migrations + pytest on postgres:16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: capacity
          POSTGRES_PASSWORD: capacity
          POSTGRES_DB: capacity_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U capacity -d capacity_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://capacity:capacity@localhost:5432/capacity_test
      TEST_DATABASE_URL: postgresql+psycopg://capacity:capacity@localhost:5432/capacity_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_MODE: local
      SECRET_KEY: ci-only-secret
      WEBHOOK_SECRET: ci-only-webhook-secret
      APP_ENV: test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            ai/pyproject.toml
      - run: python -m pip install --upgrade pip
      # `capacity_ai` is a sibling package the backend imports at request time; installing it
      # here is what makes the assistant routes testable without the local PYTHONPATH trick.
      - run: pip install -e ../ai -e .[test]
      - name: single migration head
        run: |
          set -euo pipefail
          heads=$(python -m alembic heads | awk '{print $1}' | sort -u)
          echo "$heads"
          if [ "$(printf '%s\n' "$heads" | grep -c .)" -ne 1 ]; then
            echo "::error::alembic must have exactly one head; branching migrations were merged wrong"
            exit 1
          fi
      - name: migrate
        run: python -m alembic upgrade head
      - name: schema matches the model
        run: python -m alembic check
      - name: tests
        run: python -m pytest -q

  live-gate:
    name: live gate (journey + race + security matrix over HTTP)
    runs-on: ubuntu-latest
    needs: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: capacity
          POSTGRES_PASSWORD: capacity
          POSTGRES_DB: capacity
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U capacity -d capacity"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://capacity:capacity@localhost:5432/capacity
      REDIS_URL: redis://localhost:6379/0
      CELERY_MODE: local
      SECRET_KEY: ci-only-secret
      WEBHOOK_SECRET: ci-only-webhook-secret
      APP_ENV: dev
      PYTHONPATH: ${{ github.workspace }}/ai
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ./ai -e ./backend
      - name: migrate
        working-directory: backend
        run: python -m alembic upgrade head
      - name: seed
        run: python backend/scripts/seed.py
      - name: boot the API
        working-directory: backend
        run: |
          set -euo pipefail
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 \
            > "$RUNNER_TEMP/uvicorn.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/uvicorn.pid"
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/health > "$RUNNER_TEMP/health.json"; then
              cat "$RUNNER_TEMP/health.json"; echo; exit 0
            fi
            sleep 1
          done
          echo "::error::the API did not become healthy within 40s"
          cat "$RUNNER_TEMP/uvicorn.log"
          exit 1
      - name: end-to-end journey
        run: python tests/e2e/journey.py --base "$API_BASE"
      - name: booking concurrency race
        run: python tests/e2e/concurrency_race.py --base "$API_BASE" --attempters 12
      - name: security matrix
        run: python tests/security/matrix.py --base "$API_BASE" --rate-limit-per-min 120
      - name: server log (only when a step above failed)
        if: failure()
        run: cat "$RUNNER_TEMP/uvicorn.log"

  desktop-web:
    name: desktop (web build + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run test -- --run
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-web-dist
          path: desktop/dist
          if-no-files-found: error
          retention-days: 7

  mobile-android:
    name: mobile (flutter analyze + test + apk)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-android-apk-debug
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
