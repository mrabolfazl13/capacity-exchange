[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capacity-ai"
version = "1.0.0"
description = "Capacity Exchange deterministic matching/insight algorithms (offline-first, LLM optional)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3",
]

[tool.setuptools.packages.find]
include = ["capacity_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
